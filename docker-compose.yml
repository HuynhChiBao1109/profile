services:
  portfolio:
    container_name: baohc-profile
    build:
      context: .
      dockerfile: Dockerfile
    image: baohc-profile:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "1109:80"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
