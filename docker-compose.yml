services:
  portfolio:
    container_name: baohc-profile
    build:
      context: .
      dockerfile: Dockerfile
    image: baohc-profile:latest
    restart: unless-stopped
    ports:
      - "1109:1109"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:1109/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
